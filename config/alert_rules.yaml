alerts:
  - name: High_Latency_P95
    severity: critical
    condition: "latency_p95 > 3000ms"
    type: symptom-based
    owner: team-sre
    runbook: docs/alerts.md#alert-1
  - name: High_Error_Rate
    severity: critical
    condition: "error_rate_pct > 2%"
    type: symptom-based
    owner: team-sre
    runbook: docs/alerts.md#alert-2
  - name: Cost_Budget_Exceeded
    severity: warning
    condition: "total_cost_usd > 2.5"
    type: symptom-based
    owner: team-sre
    runbook: docs/alerts.md#alert-3
